name: Build and Deploy DocuMind AI

# Order is enforced with `needs` because each stage depends on the previous one
# being real:
#
#   validate -> infrastructure -> build -> provision -> deploy
#
# The frontend bundle needs the backend URL (Vite inlines it at build time), and
# the API needs its database schema and search index to exist before it serves
# traffic. Deploying code first produces an app that starts and then fails every
# request.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
      recreate_search_index:
        description: >-
          Drop and rebuild the search index. Required when the index schema
          changes in a way Azure cannot apply in place. Discards all indexed
          chunks; documents must be re-processed afterwards.
        type: boolean
        default: false

concurrency:
  # Never let two deployments race on the same environment.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20.x'
  TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-documind-ai' }}

# OIDC federated credentials instead of a long-lived AZURE_CREDENTIALS secret.
permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the two Prisma schema copies are in sync
        run: npm run check:schema-drift

      - name: Generate Prisma clients
        run: npm run prisma:generate

      - name: Type-check all workspaces
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  infrastructure:
    name: Deploy infrastructure
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.environment || 'dev' }}
    outputs:
      backendAppName: ${{ steps.deploy.outputs.backendAppName }}
      frontendAppName: ${{ steps.deploy.outputs.frontendAppName }}
      functionAppName: ${{ steps.deploy.outputs.functionAppName }}
      backendAppUrl: ${{ steps.deploy.outputs.backendAppUrl }}
      frontendAppUrl: ${{ steps.deploy.outputs.frontendAppUrl }}
      keyVaultName: ${{ steps.deploy.outputs.keyVaultName }}
      sqlServerName: ${{ steps.deploy.outputs.sqlServerName }}
      searchEndpoint: ${{ steps.deploy.outputs.searchEndpoint }}
      searchIndexName: ${{ steps.deploy.outputs.searchIndexName }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check required secrets are present
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SQL_ADMIN_PASSWORD:-}" ]; then
            echo "::error::Repository secret SQL_ADMIN_PASSWORD is not set."
            missing=1
          fi
          if [ ${#JWT_SECRET} -lt 32 ]; then
            echo "::error::Repository secret JWT_SECRET must be at least 32 characters. Generate one with: openssl rand -base64 48"
            missing=1
          fi
          exit $missing

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ env.RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION || 'eastus' }}" \
            --output none

      - name: Validate Bicep template
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADDITIONAL_CORS_ORIGINS: ${{ vars.ADDITIONAL_CORS_ORIGINS }}
        run: |
          az deployment group validate \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters "infra/parameters/${{ env.TARGET_ENV }}.bicepparam" \
            --output none

      # Idempotent, so it runs on every deployment and configuration drift in the
      # portal is corrected automatically.
      - name: Deploy Bicep
        id: deploy
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADDITIONAL_CORS_ORIGINS: ${{ vars.ADDITIONAL_CORS_ORIGINS }}
        run: |
          set -euo pipefail
          outputs=$(az deployment group create \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "documind-${{ github.run_number }}" \
            --template-file infra/main.bicep \
            --parameters "infra/parameters/${{ env.TARGET_ENV }}.bicepparam" \
            --query properties.outputs \
            --output json)

          # Template outputs deliberately contain no secrets, so this is safe.
          for key in backendAppName frontendAppName functionAppName \
                     backendAppUrl frontendAppUrl keyVaultName \
                     sqlServerName searchEndpoint searchIndexName; do
            value=$(echo "$outputs" | jq -r --arg k "$key" '.[$k].value // empty')
            if [ -z "$value" ]; then
              echo "::error::Deployment output '$key' was empty."
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

          echo "### Deployed resources" >> "$GITHUB_STEP_SUMMARY"
          echo "$outputs" | jq -r 'to_entries[] | "- **\(.key)**: \(.value.value)"' \
            >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  build:
    name: Build and package
    runs-on: ubuntu-latest
    needs: infrastructure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # -- API package ---------------------------------------------------------
      # Packaged as a self-contained tree: dist + prisma schema + production
      # node_modules. Dependencies are installed *inside* the staging directory
      # rather than copied from the workspace root, because npm hoists workspace
      # dependencies to the root - so the previous folder-based deploy shipped an
      # app with an essentially empty apps/backend/node_modules.
      - name: Build API
        run: npm run build --workspace=apps/backend

      - name: Package API
        run: |
          set -euo pipefail
          mkdir -p artifacts/backend
          cp -r apps/backend/dist artifacts/backend/dist
          cp -r apps/backend/prisma artifacts/backend/prisma
          cp apps/backend/package.json artifacts/backend/package.json

          cd artifacts/backend
          # No workspace context here, so npm builds a normal dependency tree.
          npm install --omit=dev --no-audit --no-fund --ignore-scripts
          # Generate after install so the client lands in this tree's node_modules.
          npx prisma generate
          # Prisma's query engine is an executable; the bit has to survive the zip
          # or the client fails with a spawn error on App Service.
          chmod -R a+rX node_modules/.prisma node_modules/@prisma || true

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: artifacts/backend
          include-hidden-files: true
          retention-days: 5

      # -- Worker package ------------------------------------------------------
      - name: Build worker
        run: npm run build --workspace=apps/functions

      - name: Package worker
        run: |
          set -euo pipefail
          mkdir -p artifacts/functions
          cp -r apps/functions/dist artifacts/functions/dist
          cp -r apps/functions/prisma artifacts/functions/prisma
          cp apps/functions/host.json artifacts/functions/host.json
          cp apps/functions/package.json artifacts/functions/package.json

          cd artifacts/functions
          npm install --omit=dev --no-audit --no-fund --ignore-scripts
          npx prisma generate
          chmod -R a+rX node_modules/.prisma node_modules/@prisma || true
          # Only needed to generate; the generated client embeds its own copy.
          rm -rf prisma

      - name: Upload worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions
          path: artifacts/functions
          include-hidden-files: true
          retention-days: 5

      # -- Web bundle ----------------------------------------------------------
      # VITE_API_URL is inlined by Vite at build time, which is why this job needs
      # the infrastructure outputs. Setting it as an App Service application
      # setting has no effect on an already-built bundle. It must be the backend
      # ORIGIN only - every call site already adds the /api prefix.
      - name: Build web app
        env:
          VITE_API_URL: ${{ needs.infrastructure.outputs.backendAppUrl }}
        run: |
          set -euo pipefail
          echo "Building against API origin: $VITE_API_URL"
          npm run build --workspace=apps/frontend

      - name: Package web app
        run: |
          set -euo pipefail
          mkdir -p artifacts/frontend
          cp -r apps/frontend/dist/. artifacts/frontend/
          # Dependency-free static server with SPA fallback. Needed because the
          # Node 20 App Service image no longer bundles pm2, so the conventional
          # `pm2 serve --spa` startup command fails at container start.
          cp apps/frontend/server.mjs artifacts/frontend/server.mjs
          cat > artifacts/frontend/package.json <<'JSON'
          {
            "name": "documind-frontend-host",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "engines": { "node": ">=20.0.0" },
            "scripts": { "start": "node server.mjs" }
          }
          JSON

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: artifacts/frontend
          retention-days: 5

  # ---------------------------------------------------------------------------
  provision:
    name: Migrate database and create search index
    runs-on: ubuntu-latest
    needs: infrastructure
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Azure SQL only allows Azure services by default, so this runner's egress
      # IP needs a rule of its own. Added here rather than in Bicep because each
      # job gets a different runner with a different IP.
      - name: Open SQL firewall for this runner
        id: firewall
        run: |
          set -euo pipefail
          ip=$(curl -s --max-time 20 https://api.ipify.org)
          rule="gh-runner-${{ github.run_id }}"
          echo "rule=$rule" >> "$GITHUB_OUTPUT"

          az sql server firewall-rule create \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --server "${{ needs.infrastructure.outputs.sqlServerName }}" \
            --name "$rule" \
            --start-ip-address "$ip" \
            --end-ip-address "$ip" \
            --output none

          echo "Opened SQL firewall for $ip"

      # Read secrets from Key Vault rather than duplicating them as GitHub
      # secrets, keeping Key Vault the single source of truth.
      - name: Read settings from Key Vault
        id: kv
        run: |
          set -euo pipefail
          vault="${{ needs.infrastructure.outputs.keyVaultName }}"

          fetch() {
            az keyvault secret show --vault-name "$vault" --name "$1" \
              --query value --output tsv
          }

          database_url=$(fetch DATABASE-URL)
          search_key=$(fetch SEARCH-ADMIN-KEY)

          # Masked so they cannot leak through a later command echoing its env.
          echo "::add-mask::$database_url"
          echo "::add-mask::$search_key"

          echo "database_url=$database_url" >> "$GITHUB_OUTPUT"
          echo "search_key=$search_key" >> "$GITHUB_OUTPUT"

      - name: Apply database migrations
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ steps.kv.outputs.database_url }}
        run: |
          set -euo pipefail
          npx prisma generate

          if [ -d prisma/migrations ] && [ -n "$(ls -A prisma/migrations 2>/dev/null)" ]; then
            npx prisma migrate deploy
          else
            # First deployment against an empty database and no migration history.
            # `db push` creates the schema but records no migration, so commit a
            # baseline to move to `migrate deploy` permanently:
            #   npm run prisma:baseline --workspace=apps/backend \
            #     > apps/backend/prisma/migrations/0_init/migration.sql
            echo "::warning::No migrations directory found - using 'prisma db push'. Commit a baseline migration to get versioned, reviewable schema changes."
            npx prisma db push --skip-generate
          fi

      # Creates the index on first run and updates it in place afterwards. If a
      # change cannot be applied in place the script fails loudly rather than
      # destroying data: re-run the workflow with recreate_search_index enabled.
      - name: Create or update the search index
        env:
          AZURE_SEARCH_ENDPOINT: ${{ needs.infrastructure.outputs.searchEndpoint }}
          AZURE_SEARCH_KEY: ${{ steps.kv.outputs.search_key }}
          AZURE_SEARCH_INDEX: ${{ needs.infrastructure.outputs.searchIndexName }}
          # text-embedding-3-small produces 1536-dimension vectors. Changing the
          # embedding model means recreating the index and reprocessing documents.
          EMBEDDING_DIMENSIONS: '1536'
          RECREATE_INDEX: ${{ github.event.inputs.recreate_search_index || 'false' }}
        run: npm run search:index

      # always() so a failed migration still closes the hole in the firewall.
      - name: Close SQL firewall
        if: always() && steps.firewall.outputs.rule != ''
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --server "${{ needs.infrastructure.outputs.sqlServerName }}" \
            --name "${{ steps.firewall.outputs.rule }}" \
            --output none || true

  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [infrastructure, build, provision]
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend
          path: backend

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.infrastructure.outputs.backendAppName }}
          package: backend

      # A successful deploy is not a working app. This is what catches a bad
      # DATABASE_URL, a missing app setting, or a crash-looping container.
      - name: Verify readiness
        run: |
          set -euo pipefail
          url="${{ needs.infrastructure.outputs.backendAppUrl }}/health/ready"
          body=''

          for attempt in $(seq 1 30); do
            body=$(curl -sS --max-time 15 "$url" || true)
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo 000)

            if [ "$status" = "200" ]; then
              echo "Ready: $body"
              echo "API readiness check passed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Attempt $attempt: HTTP $status $body"
            sleep 10
          done

          echo "::error::API did not become ready within 5 minutes. Last response: $body"
          exit 1

  # ---------------------------------------------------------------------------
  deploy-worker:
    name: Deploy document worker
    runs-on: ubuntu-latest
    needs: [infrastructure, build, provision]
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: functions
          path: functions

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.infrastructure.outputs.functionAppName }}
          package: functions
          # The package already contains compiled JS and production node_modules.
          enable-oryx-build: false
          scm-do-build-during-deployment: false

      - name: Confirm the trigger registered
        run: |
          set -euo pipefail
          # A worker that throws while loading a module reports zero functions,
          # which otherwise looks exactly like a successful deployment.
          for attempt in $(seq 1 12); do
            count=$(az functionapp function list \
              --name "${{ needs.infrastructure.outputs.functionAppName }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query 'length(@)' --output tsv 2>/dev/null || echo 0)

            if [ "${count:-0}" -ge 1 ]; then
              echo "Function App reports $count function(s)."
              echo "Worker registered $count function(s)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Attempt $attempt: no functions reported yet."
            sleep 15
          done

          echo "::error::Function App reports no functions. Check Application Insights traces for a module load failure."
          exit 1

  # ---------------------------------------------------------------------------
  deploy-web:
    name: Deploy web app
    runs-on: ubuntu-latest
    needs: [infrastructure, build, deploy-api]
    environment: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: frontend

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.infrastructure.outputs.frontendAppName }}
          package: frontend

      - name: Verify the site serves and deep links resolve
        run: |
          set -euo pipefail
          url="${{ needs.infrastructure.outputs.frontendAppUrl }}"

          for attempt in $(seq 1 20); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$url/healthz" || echo 000)

            if [ "$status" = "200" ]; then
              # Client-side routes must not 404 on a hard refresh; this is the
              # SPA-fallback check.
              deep=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$url/dashboard" || echo 000)
              echo "healthz=$status /dashboard=$deep"

              if [ "$deep" = "200" ]; then
                echo "Web app serving, SPA fallback verified." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi

            echo "Attempt $attempt: HTTP $status"
            sleep 10
          done

          echo "::error::Frontend did not serve successfully."
          exit 1
