<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DocuMind AI - Chat with your documents</title>
    <meta
      name="description"
      content="Upload a PDF and DocuMind summarises it, makes it searchable, and answers questions about it in plain language."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph, so a shared link renders with a title instead of a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DocuMind AI" />
    <meta
      property="og:description"
      content="Upload a PDF and chat with it. Summaries, semantic search and grounded answers."
    />

    <!-- Preconnect to the font host before the CSS that requests it is parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
